[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "KAPy"
version = "0.5.1.dev0"
description = "A Python package for climate data processing and analysis."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Mark R. Payne", email = "mapa@dmi.dk" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]

[project.urls]
Homepage = "https://github.com/Klimaatlas/KAPy"
Documentation = "https://github.com/Klimaatlas/KAPy/docs"

[tool.setuptools.packages.find]
where = ["workflow"]

[tool.black]
line-length = 88
target-version = ['py39']
include = '^workflow/.*\.pyi?$'

[tool.ruff]
line-length = 88
include = ["workflow/**/*.py"]

[tool.ruff.lint.per-file-ignores]
"workflow/scripts/*.py" = ["F821"]  # Only ignore in scripts
"workflow/KAPy/__init__.py" = ["F401", "F403"]  # Star imports OK in __init__