# KAPy testing configuration
#
# This configuration provides a configuration with all features of KAPy turned on.
# It is intended to be a complement to the minimum working example in ./config/
# showing how everything in KAPy is configured, and also to be used as a test suite.
# https://download.dmi.dk/Research_Projects/KAPy/tas_example_dataset.zip
#
# This configuration can be used directly with the following command
# snakemake --configfile workflow/testing/config.yaml ... 


configuration_tables:
    inputs:  'workflow/testing/inputs.tsv'
    indicators: 'workflow/testing/indicators.tsv'
    secondary_variables: 'workflow/testing/secondaryVars.tsv'
    bias_adjustment: 'workflow/testing/biasAdjustment.tsv'
    tertiary_variables: 'workflow/testing/tertiaryVars.tsv'
    periods:  'workflow/testing/periods.tsv'
    seasons: 'workflow/testing/seasons.tsv'
output_directory: "testing"

# Configuration options------------------------------------
areal_statistics:
    ensemble_areal_statistics: True
    member_areal_statistics: False
    use_area_weighting: True
    shapefile: 'docs/tutorials/Tutorial05_files/Ghana_regions.shp'
cutouts:
    method: 'lonlatbox'  #'none'
    xmin: -4
    xmax: 2
    ymin: 4
    ymax: 12
ensembles:
    percentiles: [0,50,100]  #Use full data range due to small ensemble size.
    method: "linear"
output_grid:
    template_type: 'cdo'
    grid_name: 'Ghana025'
    method: 'bilinear'
    path: 'workflow/testing/griddes.txt'

# Advanced options-------------
dask_resources:  workflow/testing/dask.tsv
